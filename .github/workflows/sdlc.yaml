name: SDLC # Software Delivery Lifecycle Automation

on:
  push:
    branches: [v3.x, main, dev]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # https://github.com/actions/checkout/releases/tag/v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0 # IMPORTANT: fetch full history so we can diff

      # https://github.com/actions/setup-node/releases/tag/v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22.17.1"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Run commitlint on PR commits
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "Linting commits from ${{ github.event.pull_request.base.sha }} to ${{ github.event.pull_request.head.sha }}"
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Run commitlint on push commits
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "Linting commits from ${{ github.event.before }} to ${{ github.event.after }}"
          npx commitlint --from ${{ github.event.before }} --to ${{ github.event.after }}

